name: aether_ops_dashboard
description: "Hierarchical Operation Control and Monitoring Dashboard in Flutter with sub-flows and resource gauges"
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.2.0 <4.0.0"
  flutter: ">=3.16.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_flow_chart: ^1.2.0
  provider: ^6.1.2
  fl_chart: ^0.69.0
  sqflite: ^2.3.3
  sqflite_common_ffi: ^2.3.3
  http: ^1.2.2
  web_socket_channel: ^3.0.1
  window_manager: ^0.3.9
  intl: ^0.19.0
  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
